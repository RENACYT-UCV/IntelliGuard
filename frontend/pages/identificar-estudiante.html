<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Pertenencia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="../assets/css/identificar-estudiante.css">
  <!--
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous">
  -->
</head>
<body>
  <div class="header">
    <span class="titulo">IDENTIFICAR ESTUDIANTE</span>
    <button class="btn btn-secondary" id="menuBtn" onclick="menu()"> Menu </button>
  </div>

  <div class="container mt-4">
    <!-- Contenedor principal en dos columnas -->
    <div class="d-flex flex-row gap-4">
      
      <!-- IZQUIERDA: Video + Canvas + Spinner + Progreso -->
      <div class="flex-grow-1 position-relative rounded overflow-hidden" style="max-width: 65%;">
        <div class="position-relative">
          <video id="videoElement" autoplay playsinline class="w-100 rounded"></video>
          <canvas id="canvas" class="position-absolute top-0 start-0 w-100 h-100"></canvas>
          <div class="spinner-box position-absolute top-50 start-50 translate-middle" style="display: none;">
            <div class="spinner"></div>
            <span class="spinner-text">Buscando</span>
          </div>
        </div>

        <!-- Barra de progreso debajo del video -->
        <div id="progreso-reconocimiento" class="mt-3">
          <div class="progress mb-1" style="height: 10px;">
            <div class="progress-bar" role="progressbar" style="width: 0%;" id="barra-progreso"></div>
          </div>
          <div class="d-flex justify-content-between">
            <span id="porcentaje-progreso">0%</span>
            <span id="mensaje-progreso">Sin Resultados ...</span>
          </div>
        </div>
      </div>

      <!-- DERECHA: Resultados y Retry -->
      <div class="d-flex flex-column align-items-end" style="width: 400px;">
        <!-- Sección de botones -->
        <div class="d-flex flex-column align-items-end gap-2 mb-3">
          <!-- Fila con dos botones lado a lado -->
          <div class="d-flex gap-2">
            <a href="registrarEstudiante.html" class="btn btn-success">
              <i class="fas fa-user-plus me-1"></i> Registrar Estudiante
            </a>
            <button id="toggleCameraButton" class="btn btn-primary">
              <i class="fas fa-camera-rotate me-1"></i> Voltear
            </button>
          </div>

          <!-- Botón grande alineado al ancho de los dos anteriores -->
          <button id="searchEstudianteBtn" class="btn btn-danger" style="width: 398px;">
            <i class="fas fa-search me-1"></i> Buscar
          </button>
        </div>

        <!-- Sección de resultado debajo de los botones -->
        <div class="d-flex flex-column align-items-stretch" style="width: 100%;">
          <button id="retryBtn" class="btn btn-warning mb-3" style="display: none;">Reintentar</button>

          <div id="resultadoEstudiante" class="border p-2 rounded bg-light">
            Sin Resultados de Búsqueda
          </div>
        </div>
      </div>

    <!-- Botón siguiente -->
    <div class="d-flex justify-content-end mt-4">
      <button class="btn btn-primary" id="nextBtn" style="display: none;">Siguiente</button>
    </div>
  </div>

  <script src="../assets/js/identificar-estudiante.js"></script>
  <script src="../assets/js/utils/util.js"></script>
  <script src="../assets/js/utils/sessionManager.js"></script>
  <script src="../assets/js/utils/config.js"></script>
</body>
</html>
