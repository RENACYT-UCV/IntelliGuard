<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estudiante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/registrarEstudiante.css">
</head>
<body>
    <div class="header">
        <span class="username">REGISTRAR ESTUDIANTE</span>
        <button class="btn btn-secondary" onclick="window.location.href='menu.html'">Menu</button>
    </div>

    <div class="container">
        <div class="row">
            <div class="col">
                <div id="step1">
                    <h2 class="text-center mb-4">Registro de Estudiante</h2>
                    
                    <!-- Formulario de datos -->
                    <div class="form-container">
                        <div class="form-group">
                            <label for="codigoEstudiante">Código de Estudiante</label>
                            <input type="text" id="codigoEstudiante" required>
                        </div>
                        <div class="form-group">
                            <label for="nombreCompleto">Nombres Completos</label>
                            <input type="text" id="nombreCompleto" required>
                        </div>
                        <div class="form-group">
                            <label for="carrera">Carrera</label>
                            <input type="text" id="carrera" required>
                        </div>
                        <div class="form-group">
                            <label for="planEstudiante">Plan de Estudio</label>
                            <input type="text" id="planEstudiante" required>
                        </div>
                    </div>

                    <!-- Captura de fotos -->
                    <div class="camera-container">
                        <video id="videoElement" autoplay playsinline></video>
                        <button class="capture-btn" id="captureBtn">Capturar Foto</button>
                    </div>

                    <div class="photo-count">
                        Fotos capturadas: <span id="photoCount">0</span>/5
                    </div>

                    <div class="photo-preview" id="photoPreview">
                        <!-- Las fotos capturadas se mostrarán aquí -->
                    </div>

                    <div class="text-center mt-4">
                        <button id="registrarBtn" class="btn btn-primary" disabled>Registrar Estudiante</button>
                        <button class="btn btn-secondary" onclick="window.location.href='../index.html'">Cancelar</button>
                    </div>
                </div>

                <div id="step2" style="display: none;">
                    <div class="text-center mt-5">
                        <h2>¡Registro Completado!</h2>
                        <p class="mt-4">El estudiante ha sido registrado exitosamente.</p>
                        <button class="btn btn-primary mt-4" onclick="window.location.href='../index.html'">Volver al Menú</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../utils/config.js"></script>
    <script src="../utils/sessionManager.js"></script>
    <script src="../utils/iaService.js"></script>
    <script src="../assets/js/registrarEstudiante.js"></script>
</body>
</html>
