<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registrar Pertenencia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/identificar-objeto.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" />
</head>
<body>

  <div class="header">
    <span class="titulo">IDENTIFICAR OBJETO</span>
    <button class="btn btn-secondary" id="menuBtn" onclick="menu()">Menu</button>
  </div>

  <div class="container mt-4">
    <div class="d-flex flex-row gap-4">
      
      <!-- IZQUIERDA: Video + Canvas + Spinner -->
      <div class="flex-grow-1 position-relative rounded overflow-hidden" style="max-width: 65%;">
        <div class="position-relative">
          <video id="videoObjeto" autoplay playsinline class="w-100 rounded"></video>
          <canvas id="canvasObjeto" class="position-absolute top-0 start-0 w-100 h-100"></canvas>
          <div class="spinner-box position-absolute top-50 start-50 translate-middle" style="display: none;">
            <div class="spinner"></div>
            <span class="spinner-text">Buscando</span>
          </div>
        </div>

        <!-- Barra de progreso (si deseas usarla) -->
        <div id="progreso-objeto" class="mt-3">
          <div class="progress mb-1" style="height: 10px;">
            <div class="progress-bar" role="progressbar" style="width: 0%;" id="barra-progreso-objeto"></div>
          </div>
          <div class="d-flex justify-content-between">
            <span id="porcentaje-progreso-objeto">0%</span>
            <span id="mensaje-progreso-objeto">Sin Resultados ...</span>
          </div>
        </div>
      </div>

      <!-- DERECHA: Botones + Resultados -->
      <div class="d-flex flex-column align-items-end" style="width: 400px;">
        <div class="d-flex flex-column align-items-end gap-2 mb-3">
          <div class="d-flex gap-2">
            <a href="registrarPertenencia.html" class="btn btn-success">
              <i class="fas fa-box-open me-1"></i> Registrar Objeto
            </a>
            <button id="retryBtnObjeto" class="btn btn-warning" style="display: none;">
              <i class="fas fa-rotate-left me-1"></i> Reintentar
            </button>
          </div>
          <button id="captureBtnObjeto" class="btn btn-danger" style="width: 398px;">
            <i class="fas fa-search me-1"></i> Identificar Pertenencia
          </button>
        </div>

        <!-- Resultado -->
        <div class="d-flex flex-column align-items-stretch" style="width: 100%;">
          <div id="resultadoObjeto" class="border p-2 rounded bg-light">
            Sin Búsqueda de Objeto
          </div>
          <div id="listaCoincidencia" class="coincidencias-container mt-2"></div>
        </div>
      </div>
    </div>

    <!-- Registro alternativo -->
    <div class="d-flex justify-content-end mt-4">
      <span>
        ¿Esta pertenencia no coincide con ninguna mostrada?
        <button id="nextBtn" class="btn btn-primary ms-2" style="display: none;">
          Registrar nueva pertenencia
        </button>
      </span>
    </div>
  </div>

  <script src="../js/identificar-objeto.js"></script>
  <script src="../utils/sessionManager.js"></script>
  <script src="../utils/config.js"></script>
  <script src="../utils/util.js"></script>
</body>
</html>
