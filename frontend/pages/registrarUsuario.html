<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registrar Usuario</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../assets/css/registrarUsuario.css" />
</head>
<body>
  <div class="header">
    <span class="titulo">REGISTRAR PERSONAL</span>
    <a class="btn btn-secondary" id="menuBtn" href="./gestionarUsuario.html">Volver</a>
  </div>

  <div class="container">
    <h1>Registrar Personal</h1>
    <form id="registerForm" class="form-main">
      <div class="left-side">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input
            type="text"
            class="form-control"
            id="username"
            autocomplete="off"
            required
          />
        </div>
        <div class="mb-3">
          <label for="rol" class="form-label">Rol</label>
          <select class="form-control" id="rol" required>
            <option value="">Seleccione un rol</option>
            <option value="2">Administrador</option>
            <option value="1">Personal</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary">Registrar</button>
        <div id="message" class="mt-2"></div>
      </div>

      <div class="separator"></div>

      <div class="right-side keyboard-box">
        <h2>Teclado Virtual</h2>
        <div class="mb-3">
          <label for="password" class="form-label">
            Password
            
          </label>
          <input
            type="password"
            class="form-control"
            id="password"
            autocomplete="off"
            readonly
            required
          />
          <small class="text-muted" style="display: block; font-weight: 400; font-size: 0.875rem;">
              Mínimo 6 dígitos
            </small>
        </div>
        <div class="keyboard" id="keyboard">
          <button type="button" onclick="agregarDigito(1)">1</button>
          <button type="button" onclick="agregarDigito(2)">2</button>
          <button type="button" onclick="agregarDigito(3)">3</button>
          <button type="button" onclick="agregarDigito(4)">4</button>
          <button type="button" onclick="agregarDigito(5)">5</button>
          <button
            type="button"
            class="btn btn-light"
            onclick="eliminarDigito()"
            aria-label="Borrar"
          >
            <i class="bi bi-backspace"></i>
          </button>
          <button type="button" onclick="agregarDigito(6)">6</button>
          <button type="button" onclick="agregarDigito(7)">7</button>
          <button type="button" onclick="agregarDigito(8)">8</button>
          <button type="button" onclick="agregarDigito(9)">9</button>
          <button type="button" onclick="agregarDigito(0)">0</button>
          <button
            type="button"
            class="btn btn-light"
            onclick="limpiarDigitos()"
            aria-label="Limpiar"
          >
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>
    </form>
  </div>

  <script src="../assets/js/utils/config.js"></script>
  <script src="../assets/js/registrarUsuario.js"></script>
  <script src="../assets/js/utils/sessionManager.js"></script>
  <script src="../assets/js/utils/util.js"></script>
</body>
</html>
