<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Estudiante - IntelliGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/loginEstudiante.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="login-container">
            <h2 class="text-center mb-4">Login Estudiante</h2>
            
            <!-- Contenedor de la cámara -->
            <div class="camera-container">
                <video id="videoElement" autoplay playsinline class="w-100 rounded"></video>
                <canvas id="canvas" style="display: none;"></canvas>
                
                <!-- Controles de la cámara -->
                <div class="camera-controls mt-3">
                    <button type="button" id="toggleCameraBtn" class="btn btn-secondary">
                        <i class="fas fa-sync-alt"></i> Cambiar Cámara
                    </button>
                </div>
            </div>

            <!-- Mensajes de estado -->
            <div id="statusContainer" class="mt-3">
                <div class="progress mb-2" style="display: none;">
                    <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" 
                         role="progressbar" style="width: 0%"></div>
                </div>
                <div id="statusText" class="text-center"></div>
            </div>

            <!-- Botón de login (inicialmente oculto) -->
            <button id="loginBtn" class="btn btn-primary w-100 mt-3" style="display: none;">
                Iniciar Sesión
            </button>
        </div>
    </div>

    <script src="../utils/config.js"></script>
    <script src="../utils/sessionManager.js"></script>
    <script src="../assets/js/loginEstudiante.js"></script>
</body>
</html>
