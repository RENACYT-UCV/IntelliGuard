<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Pertenencia - IntelliGuard</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/registrarPertenencia.css">
</head>
<body>
  <div class="container">
    <div class="registro-container">
      <h2>Registrar Nueva Pertenencia</h2>
      
      <div class="camera-container">
        <video id="video" autoplay playsinline></video>
        <button id="captureBtn" class="btn">Capturar Imagen</button>
      </div>

      <div class="preview-container" style="display: none;">
        <img id="preview" alt="Vista previa">
        <button id="retakeBtn" class="btn">Volver a tomar</button>
      </div>

      <form id="registroForm">
        <div class="form-group">
          <label for="codigoEstudiante">Código del Estudiante:</label>
          <input type="text" id="codigoEstudiante" name="codigoEstudiante" required>
        </div>

        <div class="form-group">
          <label for="nombreEstudiante">Nombre:</label>
          <input type="text" id="nombreEstudiante" name="nombreEstudiante" required>
        </div>

        <div class="form-group">
          <label for="carreraEstudiante">Carrera:</label>
          <input type="text" id="carreraEstudiante" name="carreraEstudiante" required>
        </div>

        <div class="form-group">
          <label for="planEstudiante">Plan:</label>
          <input type="text" id="planEstudiante" name="planEstudiante" required>
        </div>

        <div class="form-group">
          <label for="tipoObjeto">Tipo de Objeto:</label>
          <select id="tipoObjeto" required>
            <option value="">Seleccione un tipo</option>
            <option value="mochila">Mochila</option>
            <option value="laptop">Laptop</option>
            <option value="celular">Celular</option>
            <option value="tablet">Tablet</option>
            <option value="otro">Otro</option>
          </select>
        </div>

        <div class="form-group">
          <label for="descripcion">Descripción:</label>
          <textarea id="descripcion" required></textarea>
        </div>

        <div class="registro-info"></div>

        <div class="registro-result" style="display: none;">
          <div class="response-message"></div>
          <i class="fas fa-check-circle success-icon" style="display: none;"></i>
          <i class="fas fa-times-circle error-icon" style="display: none;"></i>
        </div>

        <div class="message" id="message"></div>

        <div class="button-group">
          <button type="submit" class="btn btn-primary">Registrar Pertenencia</button>
          <button type="button" class="btn btn-secondary" onclick="window.location.href='menu.html'">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
  <script src="../utils/sessionManager.js"></script>
  <script src="../assets/js/registrarPertenencia.js"></script>
</body>
</html>
