<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Administrador</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/menu.css">
</head>
<body>
  <div class="header">
    <div class="header-username">
      <span class="username">Administrador: <span id="admin-username"></span></span>
      <button class="logout-btn" onclick="logout()">Salir</button>
    </div>
    <br>
    <span class="rol">Rol: Administrador</span>
  </div>
  <div class="container d-flex flex-column align-items-center justify-content-center" style="min-height: 60vh;">
    <div class="row mt-3 justify-content-center w-100">
      <div class="col-12 col-md-6 mb-4 d-flex justify-content-center">
        <a href="historialRegistros.html" class="btn btn-primary btn-lg w-100 mx-2">Historial de Pertenencias</a>
      </div>
      <div class="col-12 col-md-6 mb-4 d-flex justify-content-center">
        <a href="registroEstudiante.html" class="btn btn-secondary btn-lg w-100 mx-2">Registros de Estudiantes</a>
      </div>
    </div>
  </div>
  <script src="../utils/sessionManager.js"></script>
  <script>
    // Mostrar el nombre de usuario admin
    document.addEventListener('DOMContentLoaded', function() {
      var username = getCookie('username');
      if (username) {
        document.getElementById('admin-username').textContent = username;
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
