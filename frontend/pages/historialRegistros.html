<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial de Registros</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/historialRegistros.css">
</head>
<body>
  <div class="header">
    <span class="titulo">HISTORIAL DE PERTENENCIAS</span>
  </div>
  <div class="container mt-4">
    <div class="card">
      <div class="card-body">
        <h4 class="card-title mb-4">Historial de Pertenencias</h4>
        <button class="btn btn-primary mb-3" id="btnCargarHistorial">Cargar historial</button>
        <div class="table-responsive">
          <table class="table table-bordered" id="tablaHistorial">
            <thead>
              <tr>
                <th>Estudiante</th>
                <th>Objeto</th>
                <th>Fecha Entrada</th>
                <th>Fecha Salida</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../utils/config.js"></script>
  <script src="../utils/util.js"></script>
  <script src="../assets/js/historialRegistros.js"></script>
</body>
</html>
