<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/menu.css">
</head>

<body>
  <div class="header">
    <div class="header-username">
      <span class="username" id="usernameDisplay">Nombre de Usuario</span>
      <button class="logout-btn" id="logoutBtn">Salir</button>
    </div>
    <span class="rol" id="rolDisplay">Rol</span>
  </div>
  <div class="container content-Administrador">
    <div class="row mt-3 justify-content-center">
      <div class="col-6 col-md-6 mb-4">
        <a href="../../reportes/pages/reporte.html"
          class="card h-md-250 border rounded overflow-hidden flex-md-row shadow-sm position-relative"
          style="background-color: white;">
          <div class="card-body d-flex flex-column position-static">
            <strong class="d-inline-block mb-2 text-primary">Reportes</strong>
          </div>
        </a>
      </div>
      <div class="col-6 col-md-6 mb-4">
        <a href="../../gestion_personal/pages/gestionarUsuario.html"
          class="card h-md-250 border rounded overflow-hidden flex-md-row shadow-sm position-relative"
          style="background-color: white;">
          <div class="card-body d-flex flex-column position-static">
            <strong class="d-inline-block mb-2 text-primary">Gestionar Personal</strong>
          </div>
        </a>
      </div>
    </div>
  </div>

  <script>
    // Función para cerrar sesión
    function handleLogout() {
      // Limpiar el almacenamiento local
      localStorage.removeItem('token');
      localStorage.removeItem('user');

      // Redirigir al login
      window.location.href = '../pages/index.html';
    }

    // Configurar el botón de logout
    document.getElementById('logoutBtn').addEventListener('click', handleLogout);

    // Mostrar información del usuario
    const userStr = localStorage.getItem('user');
    if (userStr) {
      try {
        const user = JSON.parse(userStr);
        document.getElementById('usernameDisplay').textContent = user.usuario || 'Usuario';
        document.getElementById('rolDisplay').textContent = user.rol || 'Personal';
      } catch (e) {
        console.error('Error parsing user data:', e);
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
